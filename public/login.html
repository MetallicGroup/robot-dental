<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autentificare Dental Bot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background:#f5f5f7; display:flex; align-items:center; justify-content:center; height:100vh; margin:0; }
        .card { background:#fff; padding:24px 28px; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,0.08); width:100%; max-width:360px; }
        h1 { margin:0 0 16px; font-size:22px; color:#111827; }
        label { display:block; margin:12px 0 4px; font-size:14px; color:#4b5563; }
        input { width:100%; padding:10px 12px; border-radius:8px; border:1px solid #d1d5db; font-size:14px; box-sizing:border-box; }
        button { margin-top:16px; width:100%; padding:10px 14px; border:none; border-radius:8px; background:#007AFF; color:#fff; font-size:15px; cursor:pointer; }
        button:hover { opacity:0.95; }
        .error { margin-top:10px; color:#b91c1c; font-size:13px; min-height:18px; }
        .hint { margin-top:12px; font-size:12px; color:#6b7280; }
    </style>
</head>
<body>
    <div class="card">
        <h1>Autentificare</h1>
        <form id="loginForm">
            <label for="username">Utilizator</label>
            <input id="username" name="username" autocomplete="username" required />

            <label for="password">Parolă</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required />

            <button type="submit">Intră în platformă</button>
            <div class="error" id="error"></div>
            <div class="hint">Implicit (dacă nu schimbi în .env): <strong>admin / admin123</strong></div>
        </form>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('error');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.textContent = '';

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                if (res.ok) {
                    window.location.href = '/';
                } else {
                    const data = await res.json().catch(() => ({}));
                    errorBox.textContent = data.error || 'Date de autentificare invalide.';
                }
            } catch (err) {
                errorBox.textContent = 'Eroare de rețea. Încearcă din nou.';
            }
        });
    </script>
</body>
</html>
